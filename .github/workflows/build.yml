name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle
        run: |
          ok=0
          for u in \
            https://services.gradle.org/distributions/gradle-8.7-bin.zip \
            https://downloads.gradle.org/distributions/gradle-8.7-bin.zip \
            https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip; do
            if curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o g.zip "$u"; then ok=1; break; fi
          done
          [ "$ok" = 1 ] || { echo "no gradle mirror worked"; exit 1; }
          unzip -q g.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-8.7/bin" >> "$GITHUB_PATH"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: HideHUN
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HideHUN.apk
          gh release create "build-${{ github.run_number }}" HideHUN.apk \
            --title "HideHUN #${{ github.run_number }}" --notes "auto" --latest
